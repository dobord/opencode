name: offset-observer-verify

on:
  pull_request:
    branches:
      - marketplace

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: offset observer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Check app types
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bun run typecheck

      - name: Repeat reconnect regression
        working-directory: packages/app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            echo "=== reconnect attempt $attempt ==="
            bun test \
              --only-failures \
              --preload ./happydom.ts \
              ./src/pages/session/timeline/observe-element-offset.test.ts
          done

      - name: Run complete app unit suite
        working-directory: packages/app
        run: bun run test:unit
