name: Apply Marketplace SQLite, CAS, and API

on:
  pull_request:
    branches:
      - agent/marketplace-local-registry
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/marketplace-sqlite-api-cache
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('.github/agent-marketplace-sqlite-api-cache/apply.py')
          text = script.read_text()
          old = "replace('packages/opencode/test/config/config.test.ts', 'LayerNode.group([Config.node, FSUtil.node, Env.node, CrossSpawnSpawner.node])\\n', 'LayerNode.group([Config.node, MarketplaceRegistry.node, FSUtil.node, Env.node, CrossSpawnSpawner.node])\\n')"
          new = "replace('packages/opencode/test/config/config.test.ts', 'LayerNode.group([Config.node, FSUtil.node, Env.node, CrossSpawnSpawner.node]), [', 'LayerNode.group([Config.node, MarketplaceRegistry.node, FSUtil.node, Env.node, CrossSpawnSpawner.node]), [')"
          if old not in text:
              raise SystemExit('config test bootstrap anchor was not found in apply.py')
          script.write_text(text.replace(old, new, 1))
          PY
          python3 .github/agent-marketplace-sqlite-api-cache/apply.py
          python3 - <<'PY'
          from pathlib import Path
          schema = Path('packages/core/src/marketplace-schema.ts')
          text = schema.read_text()
          old = 'export const Profile = Schema.Unknown.annotate({ identifier: "MarketplaceProfile" })'
          new = '''const ProfileSource = Schema.Struct({
            id: Schema.String,
            name: Schema.String,
            url: Schema.String,
            trust: Schema.optional(Trust),
          })

          const ProfilePackage = Schema.Struct({
            key: Schema.String,
            source: Schema.String,
            catalog: Schema.String,
            item: Schema.String,
            name: Schema.String,
            kind: Schema.String,
            version: Schema.String,
            enabled: Schema.Boolean,
            components: Schema.Struct({
              skills: Schema.Record(Schema.String, Schema.Boolean),
              mcp: Schema.Record(Schema.String, Schema.Boolean),
            }),
          })

          export const Profile = Schema.Struct({
            schema: Schema.Literal("opencode.marketplace.profile/v1"),
            name: Schema.String,
            description: Schema.optional(Schema.String),
            generated_at: Schema.String,
            sources: Schema.Array(ProfileSource),
            packages: Schema.Array(ProfilePackage),
          }).annotate({ identifier: "MarketplaceProfile" })'''
          if old not in text:
              raise SystemExit('Marketplace profile schema anchor was not found')
          schema.write_text(text.replace(old, new, 1))
          PY
          rm -rf .github/agent-marketplace-sqlite-api-cache
          rm .github/workflows/agent-marketplace-sqlite-api-cache.yml

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Generate SQLite migration
        shell: bash
        run: |
          cd packages/core
          bun run migration --name marketplace_registry

      - name: Generate SDKs
        shell: bash
        run: |
          cd packages/sdk/js
          set +e
          bun run build 2>&1 | tee /tmp/marketplace-sdk-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          types = Path('src/v2/gen/types.gen.ts').read_text() if Path('src/v2/gen/types.gen.ts').exists() else ''
          names = sorted(set(re.findall(r'export type (SessionNext\w+1) =', types)))
          print('MARKETPLACE_SDK_DUPLICATES=' + ','.join(names))
          document = json.loads(Path('openapi.json').read_text())
          schemas = document.get('components', {}).get('schemas', {})
          for name in names:
              original = name[:-1]
              print(f'MARKETPLACE_SCHEMA_DUPLICATE {name} base={original}')
              print('duplicate=' + json.dumps(schemas.get(name), sort_keys=True, separators=(',', ':'))[:4000])
              print('base=' + json.dumps(schemas.get(original), sort_keys=True, separators=(',', ':'))[:4000])
          PY
            exit "$status"
          fi
          cd ../../client
          bun run generate

      - name: Format implementation
        shell: bash
        run: |
          bun prettier --write \
            packages/core/src/marketplace.ts \
            packages/core/src/marketplace-schema.ts \
            packages/core/src/marketplace-profile.ts \
            packages/core/src/marketplace/sql.ts \
            packages/core/src/v1/config/config.ts \
            packages/opencode/src/marketplace/registry.ts \
            packages/opencode/src/marketplace/cache.ts \
            packages/opencode/src/marketplace/service.ts \
            packages/opencode/src/marketplace/overlay.ts \
            packages/opencode/src/config/config.ts \
            packages/opencode/src/effect/app-runtime.ts \
            packages/opencode/src/server/routes/instance/httpapi/api.ts \
            packages/opencode/src/server/routes/instance/httpapi/server.ts \
            packages/opencode/src/server/routes/instance/httpapi/groups/marketplace.ts \
            packages/opencode/src/server/routes/instance/httpapi/handlers/marketplace.ts \
            packages/opencode/src/cli/cmd/plug.ts \
            packages/opencode/test/marketplace/registry.test.ts \
            packages/opencode/test/marketplace/cache.test.ts \
            packages/opencode/test/config/config.test.ts \
            packages/app/src/components/marketplace-dialog.tsx \
            packages/app/src/context/server-sync.tsx \
            packages/tui/src/feature-plugins/system/marketplace.tsx \
            packages/web/src/content/docs/marketplace.mdx \
            packages/web/src/content/docs/ru/marketplace.mdx

      - name: Run Marketplace tests
        shell: bash
        run: |
          (cd packages/core && bun test test/marketplace.test.ts test/marketplace-profile.test.ts)
          (cd packages/opencode && bun test --timeout 30000 test/marketplace/*.test.ts test/config/config.test.ts)

      - name: Typecheck affected packages
        shell: bash
        run: |
          (cd packages/core && bun run typecheck)
          (cd packages/opencode && bun run typecheck)
          (cd packages/sdk/js && bun run typecheck)
          (cd packages/client && bun run typecheck)
          (cd packages/tui && bun run typecheck)
          (cd packages/app && bun run typecheck)

      - name: Validate Marketplace HTTP API
        shell: bash
        run: |
          cd packages/opencode
          bun run script/httpapi-exercise.ts --mode coverage --fail-on-missing --fail-on-skip
          bun run script/httpapi-exercise.ts --mode auth --fail-on-missing --fail-on-skip
          bun run script/httpapi-exercise.ts --mode effect --fail-on-missing --fail-on-skip

      - name: Verify generated artifacts
        shell: bash
        run: |
          (cd packages/core && bun run migration --check)
          (cd packages/client && bun run check:generated)
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "feat: add marketplace sqlite registry and API"
          git push origin HEAD:agent/marketplace-sqlite-api-cache
