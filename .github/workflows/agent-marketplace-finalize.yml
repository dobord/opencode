name: Finalize Marketplace documentation and integration

on:
  push:
    branches:
      - agent/marketplace-sqlite-api-cache
  pull_request:
    branches:
      - agent/marketplace-local-registry

concurrency:
  group: agent-marketplace-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Marketplace branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/marketplace-sqlite-api-cache
          fetch-depth: 0

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Apply documentation and integration fixes
        run: python3 .github/agent-marketplace-finalize/apply.py && python3 .github/agent-marketplace-finalize/adjust_test_layer.py

      - name: Format changed sources
        run: |
          bun prettier --write \
            packages/opencode/test/skill/skill.test.ts \
            packages/opencode/test/cli/help/help-snapshots.test.ts \
            packages/web/src/content/docs/marketplace.mdx \
            packages/web/src/content/docs/ru/marketplace.mdx

      - name: Build documentation site
        run: bun --cwd packages/web build

      - name: Regenerate CLI help snapshots
        working-directory: packages/opencode
        run: bun test -u --timeout 180000 test/cli/help/help-snapshots.test.ts

      - name: Run Marketplace and integration tests
        working-directory: packages/opencode
        run: |
          bun test --timeout 30000 \
            test/skill/skill.test.ts \
            test/marketplace/*.test.ts \
            test/config/config.test.ts \
            test/server/httpapi-global.test.ts \
            test/server/httpapi-control-plane.test.ts
          bun test --timeout 180000 test/cli/help/help-snapshots.test.ts

      - name: Typecheck affected packages
        run: |
          (cd packages/core && bun run typecheck)
          (cd packages/opencode && bun run typecheck)
          (cd packages/sdk/js && bun run typecheck)
          (cd packages/client && bun run typecheck)
          (cd packages/tui && bun run typecheck)
          (cd packages/app && bun run typecheck)

      - name: Validate generated artifacts
        run: |
          (cd packages/core && bun run migration --check)
          (cd packages/client && bun run check:generated)
          git diff --check

      - name: Publish clean final commit
        run: |
          set -euo pipefail
          rm -rf .github/agent-marketplace-finalize
          rm .github/workflows/agent-marketplace-finalize.yml
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "docs: finalize marketplace registry and API documentation"
          git push origin HEAD:agent/marketplace-sqlite-api-cache
