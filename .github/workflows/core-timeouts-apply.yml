name: core-timeouts-apply

on:
  pull_request:
    branches:
      - marketplace

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dobord/opencode' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staged workflow
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply focused integration-test timeouts
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin marketplace
          git checkout --detach origin/marketplace

          python3 - <<'PY'
          from pathlib import Path

          p = Path("packages/core/test/snapshot.test.ts")
          s = p.read_text()
          anchor = '\n  testEffect(Layer.empty).live("treats capture outside Git as unavailable", () =>'
          if s.count(anchor) != 1:
              raise SystemExit("snapshot anchor mismatch")
          before, after = s.split(anchor, 1)
          if not before.endswith("  )"):
              raise SystemExit("snapshot closure mismatch")
          p.write_text(before[:-3] + "    GIT_WORKTREE_TIMEOUT,\n  )" + anchor + after)

          p = Path("packages/core/test/session-create.test.ts")
          s = p.read_text()
          marker = 'const id = SessionV2.ID.create()\n'
          if s.count(marker) != 1:
              raise SystemExit("session constant anchor mismatch")
          s = s.replace(marker, marker + 'const DATABASE_REPLAY_TIMEOUT = 30_000\n', 1)
          anchor = '\n  it.effect("does not mask unrelated created projector defects", () =>'
          if s.count(anchor) != 1:
              raise SystemExit("session test anchor mismatch")
          before, after = s.split(anchor, 1)
          if not before.endswith("  )"):
              raise SystemExit("session closure mismatch")
          p.write_text(before[:-3] + "    DATABASE_REPLAY_TIMEOUT,\n  )" + anchor + after)
          PY

          git diff --check
          git diff -- packages/core/test/snapshot.test.ts packages/core/test/session-create.test.ts
          git config user.email "bot@opencode.ai"
          git config user.name "opencode"
          git add packages/core/test/snapshot.test.ts packages/core/test/session-create.test.ts
          git commit -m "test: allow slower core integrations on Windows"
          git push --force origin HEAD:refs/heads/marketplace-core-timeouts-result
