name: core-timeouts-apply

on:
  pull_request:
    branches:
      - marketplace

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dobord/opencode' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staged workflow
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply focused integration-test timeouts
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin marketplace
          git checkout --detach origin/marketplace

          python3 - <<'PY'
          from pathlib import Path

          def insert_before_previous_closure(lines: list[str], next_test: str, timeout: str) -> list[str]:
              matches = [i for i, line in enumerate(lines) if line == next_test]
              if len(matches) != 1:
                  raise SystemExit(f"test boundary {next_test!r} matched {len(matches)} lines")
              boundary = matches[0]
              index = boundary - 1
              while index >= 0 and lines[index] == "":
                  index -= 1
              if index < 0 or lines[index] != "  )":
                  raise SystemExit(f"test before {next_test!r} has unexpected closure {lines[index]!r}")
              lines.insert(index, f"    {timeout},")
              return lines

          snapshot = Path("packages/core/test/snapshot.test.ts")
          lines = snapshot.read_text().splitlines()
          lines = insert_before_previous_closure(
              lines,
              '  testEffect(Layer.empty).live("treats capture outside Git as unavailable", () =>',
              "GIT_WORKTREE_TIMEOUT",
          )
          snapshot.write_text("\n".join(lines) + "\n")

          session = Path("packages/core/test/session-create.test.ts")
          lines = session.read_text().splitlines()
          marker = "const id = SessionV2.ID.create()"
          matches = [i for i, line in enumerate(lines) if line == marker]
          if len(matches) != 1:
              raise SystemExit(f"session constant matched {len(matches)} lines")
          lines.insert(matches[0] + 1, "const DATABASE_REPLAY_TIMEOUT = 30_000")
          lines = insert_before_previous_closure(
              lines,
              '  it.effect("does not mask unrelated created projector defects", () =>',
              "DATABASE_REPLAY_TIMEOUT",
          )
          session.write_text("\n".join(lines) + "\n")
          PY

          git diff --check
          git diff -- packages/core/test/snapshot.test.ts packages/core/test/session-create.test.ts
          git config user.email "bot@opencode.ai"
          git config user.name "opencode"
          git add packages/core/test/snapshot.test.ts packages/core/test/session-create.test.ts
          git commit -m "test: allow slower core integrations on Windows"
          git push --force origin HEAD:refs/heads/marketplace-core-timeouts-result
