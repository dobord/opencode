name: Apply Marketplace Settings V2 style fix

on:
  push:
    branches:
      - fix/marketplace-settings-v2-style

concurrency:
  group: marketplace-settings-v2-style
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout style-fix branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/marketplace-settings-v2-style
          fetch-depth: 0

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Apply Marketplace visual-style fix
        run: python3 .github/agent-marketplace-style/apply.py

      - name: Format changed files
        run: |
          bun prettier --write \
            packages/app/src/components/marketplace-dialog.tsx \
            packages/app/src/components/marketplace-dialog.css

      - name: Typecheck UI and app
        run: |
          bun --cwd packages/ui typecheck
          bun --cwd packages/app typecheck

      - name: Run app unit tests
        run: bun --cwd packages/app test:unit

      - name: Validate diff
        run: git diff --check

      - name: Publish clean fix commit
        run: |
          set -euo pipefail
          rm -rf .github/agent-marketplace-style
          rm .github/workflows/agent-marketplace-style.yml
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "fix(app): align Marketplace with Settings V2 styles"
          git push origin HEAD:fix/marketplace-settings-v2-style
