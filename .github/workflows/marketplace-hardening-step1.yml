name: marketplace-hardening-step1

on:
  push:
    branches:
      - agent/marketplace-codex-hardening
    paths:
      - .github/marketplace-hardening-step1.py.gz.b64
      - .github/workflows/marketplace-hardening-step1.yml
  pull_request:
    branches:
      - marketplace
    types: [opened, synchronize, reopened]
    paths:
      - .github/marketplace-hardening-step1.py.gz.b64
      - .github/workflows/marketplace-hardening-step1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-hardening-step1
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config user.email "opencode-agent@users.noreply.github.com"
          git config user.name "opencode-agent[bot]"

      - name: Apply, validate, and publish marketplace hardening
        env:
          GITHUB_ACTIONS: "false"
        run: |
          set +e
          (
            set -euo pipefail
            base64 --decode .github/marketplace-hardening-step1.py.gz.b64 | gzip --decompress > "$RUNNER_TEMP/marketplace-hardening-step1.py"
            python3 "$RUNNER_TEMP/marketplace-hardening-step1.py"
            bun test packages/core/test/marketplace.test.ts packages/core/test/marketplace-compatibility.test.ts
            bun test packages/opencode/test/marketplace/cache.test.ts
            bun typecheck
          ) >"$RUNNER_TEMP/marketplace-hardening-step1.log" 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            tail -c 60000 "$RUNNER_TEMP/marketplace-hardening-step1.log" > .github/marketplace-hardening-step1.result.log
            git add .github/marketplace-hardening-step1.result.log
            git commit -m "ci: record marketplace hardening failure"
            git push origin HEAD:agent/marketplace-codex-hardening
            exit 0
          fi

          git status --short
          git add -A
          git commit -m "fix(marketplace): harden cache and compatibility"
          git push origin HEAD:agent/marketplace-codex-hardening
