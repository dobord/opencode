name: marketplace-hardening-step1

on:
  push:
    branches:
      - agent/marketplace-codex-hardening
    paths:
      - .github/marketplace-hardening-step1.py.gz.b64
      - .github/workflows/marketplace-hardening-step1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config user.email "opencode-agent@users.noreply.github.com"
          git config user.name "opencode-agent[bot]"

      - name: Apply marketplace hardening
        run: |
          base64 --decode .github/marketplace-hardening-step1.py.gz.b64 | gzip --decompress > "$RUNNER_TEMP/marketplace-hardening-step1.py"
          python3 "$RUNNER_TEMP/marketplace-hardening-step1.py"

      - name: Run focused unit tests
        env:
          GITHUB_ACTIONS: "false"
        run: |
          bun test packages/core/test/marketplace.test.ts packages/core/test/marketplace-compatibility.test.ts
          bun test packages/opencode/test/marketplace/cache.test.ts

      - name: Run typecheck
        run: bun typecheck

      - name: Commit validated changes
        run: |
          git status --short
          git add -A
          git commit -m "fix(marketplace): harden cache and compatibility"
          git push origin HEAD:agent/marketplace-codex-hardening
