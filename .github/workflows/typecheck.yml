name: typecheck

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ${{ github.repository == 'anomalyco/opencode' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

  # BEGIN agent-marketplace-sqlite-api-cache
  marketplace-sqlite-api-cache:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/marketplace-sqlite-api-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/marketplace-sqlite-api-cache
          fetch-depth: 0

      - name: Apply implementation
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('.github/agent-marketplace-sqlite-api-cache/apply.py')
          text = script.read_text()
          old = "replace('packages/opencode/test/config/config.test.ts', 'LayerNode.group([Config.node, FSUtil.node, Env.node, CrossSpawnSpawner.node])\\n', 'LayerNode.group([Config.node, MarketplaceRegistry.node, FSUtil.node, Env.node, CrossSpawnSpawner.node])\\n')"
          new = "replace('packages/opencode/test/config/config.test.ts', 'LayerNode.group([Config.node, FSUtil.node, Env.node, CrossSpawnSpawner.node]), [', 'LayerNode.group([Config.node, MarketplaceRegistry.node, FSUtil.node, Env.node, CrossSpawnSpawner.node]), [')"
          if old not in text:
              raise SystemExit('config test bootstrap anchor was not found in apply.py')
          script.write_text(text.replace(old, new, 1))
          PY
          python3 .github/agent-marketplace-sqlite-api-cache/apply.py
          python3 .github/agent-marketplace-sqlite-api-cache/post_apply.py
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/typecheck.yml')
          text = workflow.read_text()
          start = text.index('  # BEGIN agent-marketplace-sqlite-api-cache\n')
          text = text[:start].rstrip() + '\n'
          text = text.replace(
              '  pull_request:\n  workflow_dispatch:',
              '  pull_request:\n    branches: [dev]\n  workflow_dispatch:',
              1,
          )
          workflow.write_text(text)
          PY
          rm -rf .github/agent-marketplace-sqlite-api-cache
          rm .github/workflows/agent-marketplace-sqlite-api-cache.yml
          rm .github/workflows/agent-marketplace-sqlite-api-cache-push.yml

      - name: Setup Bun and dependencies
        id: setup
        if: always() && steps.apply.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/setup-bun

      - name: Generate SQLite migration
        id: migration
        if: always() && steps.setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cd packages/core
          bun run migration --name marketplace_registry

      - name: Generate SDKs
        id: sdk
        if: always() && steps.migration.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cd packages/sdk/js
          bun run build
          cd ../../client
          bun run generate

      - name: Format implementation
        id: format
        if: always() && steps.sdk.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          bun prettier --write \
            packages/core/src/marketplace.ts \
            packages/core/src/marketplace-schema.ts \
            packages/core/src/marketplace-profile.ts \
            packages/core/src/marketplace/sql.ts \
            packages/core/src/v1/config/config.ts \
            packages/opencode/src/marketplace/registry.ts \
            packages/opencode/src/marketplace/cache.ts \
            packages/opencode/src/marketplace/service.ts \
            packages/opencode/src/marketplace/overlay.ts \
            packages/opencode/src/config/config.ts \
            packages/opencode/src/effect/app-runtime.ts \
            packages/opencode/src/server/routes/instance/httpapi/api.ts \
            packages/opencode/src/server/routes/instance/httpapi/server.ts \
            packages/opencode/src/server/routes/instance/httpapi/groups/marketplace.ts \
            packages/opencode/src/server/routes/instance/httpapi/handlers/marketplace.ts \
            packages/opencode/src/cli/cmd/plug.ts \
            packages/opencode/test/fixture/config.ts \
            packages/opencode/test/marketplace/registry.test.ts \
            packages/opencode/test/marketplace/cache.test.ts \
            packages/opencode/test/config/config.test.ts \
            packages/opencode/test/server/httpapi-global.test.ts \
            packages/opencode/test/server/httpapi-control-plane.test.ts \
            packages/app/src/components/marketplace-dialog.tsx \
            packages/app/src/context/server-sync.tsx \
            packages/tui/src/feature-plugins/system/marketplace.tsx \
            packages/web/src/content/docs/marketplace.mdx \
            packages/web/src/content/docs/ru/marketplace.mdx

      - name: Run Marketplace tests
        id: tests
        if: always() && steps.format.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          (cd packages/core && bun test test/marketplace.test.ts test/marketplace-profile.test.ts)
          (cd packages/opencode && bun test --timeout 30000 test/marketplace/*.test.ts test/config/config.test.ts test/server/httpapi-global.test.ts test/server/httpapi-control-plane.test.ts)

      - name: Typecheck affected packages
        id: affected_typecheck
        if: always() && steps.tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          (cd packages/core && bun run typecheck)
          (cd packages/opencode && bun run typecheck)
          (cd packages/sdk/js && bun run typecheck)
          (cd packages/client && bun run typecheck)
          (cd packages/tui && bun run typecheck)
          (cd packages/app && bun run typecheck)

      - name: Validate Marketplace HTTP API
        id: httpapi
        if: always() && steps.affected_typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cd packages/opencode
          bun run script/httpapi-exercise.ts --mode coverage --fail-on-missing --fail-on-skip
          bun run script/httpapi-exercise.ts --mode auth --fail-on-missing --fail-on-skip
          bun run script/httpapi-exercise.ts --mode effect --fail-on-missing --fail-on-skip

      - name: Verify generated artifacts
        id: verify
        if: always() && steps.httpapi.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          (cd packages/core && bun run migration --check)
          (cd packages/client && bun run check:generated)
          git diff --check

      - name: Publish implementation or validation report
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.affected_typecheck.outcome }}
          HTTPAPI_OUTCOME: ${{ steps.httpapi.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          outcomes=(
            "$APPLY_OUTCOME"
            "$SETUP_OUTCOME"
            "$MIGRATION_OUTCOME"
            "$SDK_OUTCOME"
            "$FORMAT_OUTCOME"
            "$TESTS_OUTCOME"
            "$TYPECHECK_OUTCOME"
            "$HTTPAPI_OUTCOME"
            "$VERIFY_OUTCOME"
          )
          success=true
          for outcome in "${outcomes[@]}"; do
            if [ "$outcome" != "success" ]; then
              success=false
            fi
          done

          if [ "$success" = true ]; then
            git add -A
            git commit -m "feat: add marketplace sqlite registry and API"
            git push origin HEAD:agent/marketplace-sqlite-api-cache
            exit 0
          fi

          git reset --hard HEAD
          git clean -fd
          mkdir -p .github/agent-marketplace-sqlite-api-cache
          cat > .github/agent-marketplace-sqlite-api-cache/validation-failure.json <<JSON
          {
            "head": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "apply": "${APPLY_OUTCOME}",
            "setup": "${SETUP_OUTCOME}",
            "migration": "${MIGRATION_OUTCOME}",
            "sdk": "${SDK_OUTCOME}",
            "format": "${FORMAT_OUTCOME}",
            "tests": "${TESTS_OUTCOME}",
            "typecheck": "${TYPECHECK_OUTCOME}",
            "httpapi": "${HTTPAPI_OUTCOME}",
            "verify": "${VERIFY_OUTCOME}"
          }
          JSON
          git add .github/agent-marketplace-sqlite-api-cache/validation-failure.json
          git commit -m "ci: record marketplace validation failure"
          git push origin HEAD:agent/marketplace-sqlite-api-cache
          exit 1
  # END agent-marketplace-sqlite-api-cache
