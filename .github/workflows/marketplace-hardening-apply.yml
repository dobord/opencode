name: marketplace-hardening-apply

on:
  pull_request:
    branches:
      - marketplace
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'dobord/opencode' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staged patch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Rebuild and apply patch to marketplace
        shell: bash
        run: |
          set +e
          (
            set -euxo pipefail
            cat .github/marketplace-hardening/patch-*.b64 | base64 --decode | gzip --decompress > "$RUNNER_TEMP/marketplace-hardening.patch"
            sha256sum "$RUNNER_TEMP/marketplace-hardening.patch"

            git fetch origin marketplace
            git checkout --detach origin/marketplace
            git apply --check "$RUNNER_TEMP/marketplace-hardening.patch"
            git apply "$RUNNER_TEMP/marketplace-hardening.patch"
            rm -f .github/workflows/marketplace-dev-export.yml
            git diff --check

            git config user.email "bot@opencode.ai"
            git config user.name "opencode"
            git add -A
            git commit -m "fix: harden marketplace installation and CI"
            git push --force origin HEAD:refs/heads/marketplace-hardening-result
            git rev-parse HEAD > "$RUNNER_TEMP/result-sha"
          ) > "$RUNNER_TEMP/apply.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/apply.log"
          exit "$status"

      - name: Upload apply diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplace-hardening-apply-diagnostics
          path: ${{ runner.temp }}/apply.log
          if-no-files-found: error
          retention-days: 1

      - name: Upload result commit
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplace-hardening-result
          path: ${{ runner.temp }}/result-sha
          if-no-files-found: error
          retention-days: 1
