name: marketplace-source-export

on:
  push:
    branches:
      - agent/marketplace-source-export
    paths:
      - .github/workflows/marketplace-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Archive source
        run: git archive --format=zip --output="$RUNNER_TEMP/opencode-source.zip" HEAD

      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-source
          path: ${{ runner.temp }}/opencode-source.zip
          if-no-files-found: error
          retention-days: 1
