name: recover-offset-windows-log

on:
  pull_request:
    branches:
      - marketplace

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download completed Windows job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dobord/opencode/actions/jobs/90210393903/logs" \
            --output "$RUNNER_TEMP/offset-observer-failed-job.log"
          tail -n 160 "$RUNNER_TEMP/offset-observer-failed-job.log"

      - name: Upload recovered log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovered-offset-observer-windows-log
          path: ${{ runner.temp }}/offset-observer-failed-job.log
          if-no-files-found: error
          retention-days: 1
