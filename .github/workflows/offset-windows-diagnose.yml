name: offset-windows-diagnose

on:
  pull_request:
    branches:
      - marketplace

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Repeat reconnect regression with diagnostics
        working-directory: packages/app
        run: |
          set +e
          log="$RUNNER_TEMP/offset-observer-windows.log"
          status=0
          for attempt in $(seq 1 100); do
            echo "=== reconnect attempt $attempt ===" | tee -a "$log"
            bun test \
              --only-failures \
              --preload ./happydom.ts \
              ./src/pages/session/timeline/observe-element-offset.test.ts \
              2>&1 | tee -a "$log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              status=$code
              break
            fi
          done
          exit "$status"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offset-observer-windows-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offset-observer-windows.log
          if-no-files-found: error
          retention-days: 1
