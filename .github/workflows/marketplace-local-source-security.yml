name: Validate Marketplace local source security

on:
  push:
    branches:
      - fix/marketplace-runtime-activation

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/marketplace-runtime-activation
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply security hardening
        run: python3 .github/scripts/apply-marketplace-local-source-security.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: |
          bunx prettier --write \
            packages/opencode/src/marketplace/cache.ts \
            packages/opencode/src/marketplace/service.ts \
            packages/opencode/test/marketplace/cache.test.ts \
            packages/web/src/content/docs/marketplace.mdx \
            packages/web/src/content/docs/ru/marketplace.mdx

      - name: Test Marketplace cache boundary
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/marketplace/cache.test.ts test/marketplace/source.test.ts test/marketplace/runtime.test.ts test/server/httpapi-marketplace-runtime.test.ts

      - name: Typecheck OpenCode
        working-directory: packages/opencode
        run: bun run typecheck

      - name: Build documentation
        working-directory: packages/web
        run: bun run build

      - name: Check diff
        run: git diff --check

      - name: Publish clean implementation commit
        env:
          BRANCH: fix/marketplace-runtime-activation
        run: |
          rm -f .github/scripts/apply-marketplace-local-source-security.py
          rm -f .github/workflows/marketplace-local-source-security.yml
          git config user.name "opencode-marketplace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: contain local marketplace file artifacts"
          git push origin "HEAD:${BRANCH}"
