name: Validate Marketplace runtime and local sources

on:
  push:
    branches:
      - fix/marketplace-runtime-activation

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/marketplace-runtime-activation
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply implementation
        id: apply
        shell: bash
        run: |
          set -o pipefail
          {
            echo '## Apply implementation'
            python3 .github/scripts/fix-marketplace-runtime-local-source-bootstrap.py
            python3 .github/scripts/apply-marketplace-runtime-local-source.py
          } 2>&1 | tee /tmp/marketplace-validation.log

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          { echo '## Install dependencies'; bun install --frozen-lockfile; } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Format changed files
        id: format
        shell: bash
        run: |
          set -o pipefail
          {
            echo '## Format changed files'
            bunx prettier --write \
              packages/core/src/marketplace.ts \
              packages/core/test/marketplace.test.ts \
              packages/opencode/src/marketplace/source.ts \
              packages/opencode/src/marketplace/cache.ts \
              packages/opencode/src/marketplace/service.ts \
              packages/opencode/src/cli/cmd/plug.ts \
              packages/opencode/src/server/routes/instance/httpapi/handlers/marketplace.ts \
              packages/opencode/src/server/routes/instance/httpapi/groups/marketplace.ts \
              packages/opencode/test/marketplace/source.test.ts \
              packages/opencode/test/marketplace/cache.test.ts \
              packages/opencode/test/marketplace/runtime.test.ts \
              packages/opencode/test/server/httpapi-marketplace-runtime.test.ts \
              packages/app/src/components/marketplace-dialog.tsx \
              packages/tui/src/feature-plugins/system/marketplace.tsx \
              packages/web/src/content/docs/marketplace.mdx \
              packages/web/src/content/docs/ru/marketplace.mdx
          } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Test core marketplace catalog behavior
        id: core_tests
        working-directory: packages/core
        shell: bash
        run: |
          set -o pipefail
          { echo '## Core marketplace tests'; bun test test/marketplace.test.ts; } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Test Marketplace cache, sources, runtime projection, and API activation
        id: opencode_tests
        working-directory: packages/opencode
        shell: bash
        run: |
          set -o pipefail
          {
            echo '## OpenCode Marketplace tests'
            bun test --timeout 30000 \
              test/marketplace/cache.test.ts \
              test/marketplace/source.test.ts \
              test/marketplace/runtime.test.ts \
              test/server/httpapi-marketplace-runtime.test.ts
          } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Typecheck core
        id: core_typecheck
        working-directory: packages/core
        shell: bash
        run: |
          set -o pipefail
          { echo '## Typecheck core'; bun run typecheck; } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Typecheck OpenCode
        id: opencode_typecheck
        working-directory: packages/opencode
        shell: bash
        run: |
          set -o pipefail
          { echo '## Typecheck OpenCode'; bun run typecheck; } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Typecheck TUI
        id: tui_typecheck
        working-directory: packages/tui
        shell: bash
        run: |
          set -o pipefail
          { echo '## Typecheck TUI'; bun run typecheck; } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Typecheck app
        id: app_typecheck
        working-directory: packages/app
        shell: bash
        run: |
          set -o pipefail
          { echo '## Typecheck app'; bun run typecheck; } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Build documentation
        id: docs
        working-directory: packages/web
        shell: bash
        run: |
          set -o pipefail
          { echo '## Build documentation'; bun run build; } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Check diff
        id: diff
        shell: bash
        run: |
          set -o pipefail
          { echo '## Check diff'; git diff --check; } 2>&1 | tee -a /tmp/marketplace-validation.log

      - name: Publish clean implementation commit
        if: success()
        env:
          BRANCH: fix/marketplace-runtime-activation
        run: |
          rm -f .github/scripts/apply-marketplace-runtime-local-source.py
          rm -f .github/scripts/fix-marketplace-runtime-local-source-bootstrap.py
          rm -f .github/workflows/marketplace-runtime-local-source.yml
          rm -f .github/marketplace-runtime-local-source-validation.log
          rm -f .github/marketplace-runtime-local-source-validation.json
          git config user.name "opencode-marketplace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: activate marketplace runtime and support local sources"
          git push origin "HEAD:${BRANCH}"

      - name: Publish validation diagnostics
        if: failure()
        env:
          BRANCH: fix/marketplace-runtime-activation
          APPLY: ${{ steps.apply.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          CORE_TESTS: ${{ steps.core_tests.outcome }}
          OPENCODE_TESTS: ${{ steps.opencode_tests.outcome }}
          CORE_TYPECHECK: ${{ steps.core_typecheck.outcome }}
          OPENCODE_TYPECHECK: ${{ steps.opencode_typecheck.outcome }}
          TUI_TYPECHECK: ${{ steps.tui_typecheck.outcome }}
          APP_TYPECHECK: ${{ steps.app_typecheck.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          DIFF: ${{ steps.diff.outcome }}
        shell: bash
        run: |
          cp /tmp/marketplace-validation.log /tmp/marketplace-validation-copy.log 2>/dev/null || true
          git reset --hard HEAD
          cp /tmp/marketplace-validation-copy.log .github/marketplace-runtime-local-source-validation.log 2>/dev/null || printf 'No validation log was produced.\n' > .github/marketplace-runtime-local-source-validation.log
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          keys = [
              "APPLY", "INSTALL", "FORMAT", "CORE_TESTS", "OPENCODE_TESTS",
              "CORE_TYPECHECK", "OPENCODE_TYPECHECK", "TUI_TYPECHECK",
              "APP_TYPECHECK", "DOCS", "DIFF",
          ]
          Path(".github/marketplace-runtime-local-source-validation.json").write_text(
              json.dumps({key.lower(): os.environ.get(key) for key in keys}, indent=2) + "\n"
          )
          PY
          git config user.name "opencode-marketplace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/marketplace-runtime-local-source-validation.log .github/marketplace-runtime-local-source-validation.json
          git commit -m "chore: record marketplace validation failure [skip ci]"
          git push origin "HEAD:${BRANCH}"
