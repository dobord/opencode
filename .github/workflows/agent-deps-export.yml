name: agent-deps-export

on:
  push:
    branches:
      - agent/marketplace-hardening
    paths:
      - .github/workflows/agent-deps-export.yml
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/agent-deps-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Archive installed dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar --zstd -cf "$RUNNER_TEMP/opencode-deps.tar.zst" \
            node_modules \
            packages/*/node_modules \
            packages/console/*/node_modules \
            packages/stats/*/node_modules \
            packages/sdk/js/node_modules \
            packages/slack/node_modules 2>/dev/null || true
          test -s "$RUNNER_TEMP/opencode-deps.tar.zst"
          split -b 340M "$RUNNER_TEMP/opencode-deps.tar.zst" "$RUNNER_TEMP/opencode-deps.part-"
          ls -lh "$RUNNER_TEMP"/opencode-deps.part-*

      - name: Upload dependencies part A
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-deps-linux-a
          path: ${{ runner.temp }}/opencode-deps.part-aa
          if-no-files-found: error
          retention-days: 1

      - name: Upload dependencies part B
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-deps-linux-b
          path: ${{ runner.temp }}/opencode-deps.part-ab
          if-no-files-found: error
          retention-days: 1
